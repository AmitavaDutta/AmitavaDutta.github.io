<style>
  /* Reset the entire archive block layout to standard inline behavior */
  #archives {
    position: relative;
    padding-left: 10px !important;
  }

  /* Target the list containers and shift them completely clear of the line */
  #archives ul.list-unstyled {
    margin-left: 45px !important;
    padding-left: 0 !important;
  }

  /* Keep the items side-by-side cleanly without breaking alignment */
  #archives ul li {
    display: flex !important;
    align-items: center;
    padding: 8px 12px !important;
  }
  
  /* Lock the date block width and aggressively destroy the vertical separator line */
  #archives .date.day {
    min-width: 105px !important;
    width: 105px !important;
    display: inline-block !important;
    flex-shrink: 0 !important;
    border: none !important;
    background: none !important;
  }

  /* Force eliminate any theme pseudo-element lines attached to the date fields */
  #archives .date.day::before,
  #archives .date.day::after {
    display: none !important;
    content: none !important;
    background: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  /* Standard spacing for the job title text */
  #archives ul li > span:nth-child(2) {
    margin-left: 15px !important;
  }
</style>
